name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: lint, types, tests, build and e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run check:full

  auth-db:
    name: Auth DB rebuild, pgTAP, concurrency and advisors
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: ".node-version"
          package-manager-cache: false
      - run: npm ci --no-audit
      - run: npm run db:start
      - run: npm run db:reset
      - run: npm run db:reset
      - run: npm run db:test
      - run: npm run db:test:concurrency
      - run: npm run db:lint
      - run: npm run db:advisors
      - run: npx supabase db diff --local --schema rmc_auth_private,rmc_auth_api --use-pg-delta --strict-coverage
      - name: Stop local database
        if: always()
        run: npm run db:stop
